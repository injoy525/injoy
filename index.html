<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Race Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Arial,sans-serif;overflow:hidden;text-align:center;color:#fff}
h1{margin:10px 0;font-size:28px}
#score{margin:8px;font-size:20px}
#game{position:relative;width:400px;height:600px;margin:auto;overflow:hidden;background:#333;border:5px solid #fff}
.line{position:absolute;width:8px;height:80px;background:#fff;left:50%;transform:translateX(-50%)}
#player,.enemy{position:absolute;width:55px;height:95px;border-radius:12px;border:3px solid #fff}
#player{bottom:25px;left:172px;background:red;z-index:5}
.enemy{background:#ffd21f;z-index:4}
.window{position:absolute;width:35px;height:25px;background:#8fd3ff;left:7px;top:10px;border-radius:5px}
.enemy .window{background:#222}
#player:before,#player:after,.enemy:before,.enemy:after{content:"";position:absolute;width:12px;height:25px;background:#000;top:15px;border-radius:4px}
#player:before,.enemy:before{left:-8px}
#player:after,.enemy:after{right:-8px}
#gameOver{display:none;position:absolute;inset:0;background:rgba(0,0,0,.8);z-index:20;align-items:center;justify-content:center;flex-direction:column}
#gameOver h2{font-size:42px;margin-bottom:15px}
button{padding:12px 25px;font-size:18px;border:0;border-radius:8px;cursor:pointer}
#instructions{margin-top:10px;font-size:15px}
@media(max-width:450px){#game{width:95vw;height:75vh}}
</style>
</head>
<body>
<h1>🏎️ CAR RACE</h1>
<div id="score">Score: 0</div>
<div id="game">
  <div id="player"><div class="window"></div></div>
  <div id="gameOver">
    <h2>GAME OVER</h2>
    <p id="finalScore">Score: 0</p><br>
    <button onclick="restartGame()">Restart</button>
  </div>
</div>
<div id="instructions">⬅️ Left &nbsp;&nbsp; ➡️ Right &nbsp;&nbsp; | &nbsp;&nbsp; Avoid the cars!</div>

<script>
const game=document.getElementById("game");
const player=document.getElementById("player");
const scoreText=document.getElementById("score");
const gameOverScreen=document.getElementById("gameOver");
const finalScore=document.getElementById("finalScore");
let playerX=172,score=0,speed=5,gameRunning=true,enemies=[],lines=[];

for(let i=0;i<8;i++){
  const line=document.createElement("div");
  line.className="line";
  line.style.top=(i*90-80)+"px";
  game.appendChild(line);
  lines.push({element:line,y:i*90-80});
}

document.addEventListener("keydown",e=>{
  if(!gameRunning)return;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")playerX-=30;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")playerX+=30;
  playerX=Math.max(20,Math.min(325,playerX));
  player.style.left=playerX+"px";
});

function createEnemy(){
  const enemy=document.createElement("div");
  enemy.className="enemy";
  enemy.innerHTML='<div class="window"></div>';
  const x=Math.floor(Math.random()*6)*55+10;
  enemy.style.left=x+"px";
  enemy.style.top="-110px";
  game.appendChild(enemy);
  enemies.push({element:enemy,x,y:-110});
}

function collision(a,b){
  const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
  return !(A.bottom<B.top||A.top>B.bottom||A.right<B.left||A.left>B.right);
}

function gameLoop(){
  if(!gameRunning)return;
  lines.forEach(line=>{
    line.y+=speed;
    if(line.y>600)line.y=-80;
    line.element.style.top=line.y+"px";
  });

  for(let i=enemies.length-1;i>=0;i--){
    const enemy=enemies[i];
    enemy.y+=speed;
    enemy.element.style.top=enemy.y+"px";

    if(collision(player,enemy.element)){endGame();return}

    if(enemy.y>650){
      enemy.element.remove();
      enemies.splice(i,1);
      score++;
      scoreText.textContent="Score: "+score;
      if(score%5===0)speed+=0.7;
    }
  }
  requestAnimationFrame(gameLoop);
}

setInterval(()=>{if(gameRunning)createEnemy()},1200);

function endGame(){
  gameRunning=false;
  finalScore.textContent="Score: "+score;
  gameOverScreen.style.display="flex";
}

function restartGame(){
  enemies.forEach(e=>e.element.remove());
  enemies=[];
  playerX=172;score=0;speed=5;
  player.style.left=playerX+"px";
  scoreText.textContent="Score: 0";
  gameOverScreen.style.display="none";
  gameRunning=true;
  gameLoop();
}
gameLoop();
</script>
</body>
</html>
